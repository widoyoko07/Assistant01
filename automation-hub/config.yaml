groups:            # nama grup WA persis seperti di nama file ZIP -> kode SC
  "OWJJ - SILOG E&I Work": SILOG
  "OWJJ-TM DCIP and Embedded Pipe Installation": TODJO
  "OWJJ-DHJ MBR Crane structure + Platform Work": DHJ
  "OWJJ-WKP SS for Other Crane": WKP
  "OWJJ-TPE Mechanical Work": TPE
  "OWJJ-WME Pipe Gallery&LPS": WME
  "OWJJ - BCP(Engineering)": BCP
  "OWJJ-DWIJO Lahan 1": DJK
sc_aliases:        # penulisan nama SC di pesan WA grup ME (huruf kecil) -> kode SC
  silog: SILOG
  tohoma: TODJO
  thm: TODJO
  dwijo: TODJO
  dwidjo: TODJO
  dwj: TODJO
  djk: DJK         # DJK Service punya grup WA sendiri, bukan di grup ME
  dhj: DHJ
  wkp: WKP
  tpe: TPE
  wme: WME
sc_names:          # nama perusahaan di judul Posting (Detail_SCs.xlsx) -> kode SC
  "Wasa Mitra Engineering": WME
  "Tiga Pilar Energi": TPE
  "Semen Indonesia Logistik": SILOG
  "Duta Hita Jaya": DHJ
  "Wirya Krenindo Perkasa": WKP
  "Berkah Cipta Perkasa": BCP
  "Tohoma Mandiri": TODJO
  "Dwidjo Jaya Konstruksi Manpower Service": DJK
tbm:               # pengenal pesan Posting TBM per SC di grup WA SC (hanya SC yang sudah diverifikasi)
  SILOG:
    header: "SEMEN INDONESIA LOGISTIK"   # nama perusahaan di judul pesan (tanpa membedakan huruf besar/kecil)
    skip: "OVERTIME"                     # pesan 'TBM Overtime' bukan Posting harian
    end: "^SITE CONDITION"               # baris pertama bagian penutup yang tidak ikut Posting.txt
  WME:
    header: "WASA MITRA ENGINEERING"
    end: "^Loc\\. Coordination"
  TPE:
    header: "TIGA PILAR ENERGI"
    skip: "Work Planning tomorrow"       # 'tomorrow' = rencana besok, bukan Posting hari ini
    end: "^Weather Condition"
  DHJ:
    header: "DUTA HITA JAYA"
    end: "^Kondisi lokasi"
  WKP:
    header: "HSE DAILY REPORT PT. WKP"
    end: "^Activity HSE"
  TODJO:                                  # grup hanya mengirim workplan (tanpa blok Man Power); ejaan 'workplant/workpalne/...' bervariasi
    header_re: "work\\s*p(?:la|al)n"
    date: text                            # sering dikirim terlambat; pakai tanggal di teks
  DJK:                                    # grup 'Dwijo Lahan 1' (DJK Service): pesan 'TBM PAGI SIFT' berisi daftar absensi
    header_re: "TBM\\s+PAGI"
  BCP:                                    # grup engineering BCP: pesan 'Daily (report) Safety Toolbox Meeting' / 'SMT all'
    header_re: "daily\\s+(?:report\\s+)?(?:safety\\s+toolbox|smt)"
    end: "^Terima kasih"
wd:                # bagian rencana kerja di Posting.txt per SC (untuk Work Description DPR)
  SILOG: {start: "^WORK DESCRIPTION"}
  WME: {start: "^PLAN"}
  DHJ: {start: "^Plan"}
  TPE: {start: "^headwork", keep_start: true, stop: "^Total staff"}
  TODJO: {skip_first: 1}
  BCP: {start: "^Akti\\w+(?:\\s+(?:kerja|team))?\\s*:", stop: "^Update\\s+(?:personil|pekerja|man\\s*power)"}
  # WKP tidak punya rencana kerja di Posting -> hanya dari grup ME
drive:             # folder Google Drive
  local_root: "H:\\My Drive\\WA Export"   # Drive for Desktop (huruf drive Windows) -> disalin ke data/inbox oleh drive_sync
  subcon_inbox: "WA Export/Subcon"
  dagang_inbox: "WA Export/Dagangan"
  templates: "Otomasi/Templates"
  output: "Otomasi/Output"
dpr:
  template: DPR_template.xlsx
  filename: "{no}. OWJJ-G-DPR-ENG-{yy}-{mm}-{no}-E0_Daily Progress Report {d} {Month} {yyyy}.xlsx"
  no_start: 1263   # nomor dokumen untuk 1 Oct 2026 (aturan naiknya belum dikonfirmasi)
  timezone: Asia/Jakarta
  hours:           # jam kerja subcon di DPR; lembur (laporan OT di grup ME) mengganti finish dan total
    normal: {start: "08.00", finish: "17.00", total: 8}
    overtime: {start: "08.00", finish: "21.00", total: 12}
categories:        # kamus kata kunci K2 -> kategori
  Rumah Tangga: [listrik, pdam, wifi, galon]
  Transportasi: [bensin, tol, parkir]
me_sheet:          # sheet ME di Subcontractor MP.xlsx: satu blok per SC (nama di kolom B), satu baris per role (kolom D)
  sheet: ME
  first_row: 313
  last_row: 552
  date_row: 4        # baris tanggal; kolom E = base_date, tiap kolom berikutnya +1 hari
  base_date: "2024-08-01"
  base_col: 5
  blocks:          # kode SC di Daily MP -> nama blok di kolom B. TODJO tidak ada: blok 'Tohoma' dan 'DJK DCIP' butuh pemisahan per perusahaan
    DHJ: DHJ
    WKP: WKP
    TPE: TPE
    WME: WME
    SILOG: SILOG
    DJK: DJK
    BCP: BCP
  role_alias:      # penulisan role di Daily MP -> penulisan di sheet
    Common Labor: Commoun Labor
  new_role_default: Skilled Workers   # role baru dari Daily MP (mis. Terminasi, LPS) dicatat sebagai Skilled Workers, seperti isian manual
  role_map:        # role baru Daily MP -> baris sheet (sesuai isian manual)
    Foreman ER: Foreman
    Terminasi: Skilled Workers
    Scaffolding: Scaffolder
    M: Construction Manager      # 'M : Nama' di Posting SILOG = salah ketik CM
    LPS: Skilled Workers         # LPS = lokasi kerja (judul bagian), bukan role; orangnya pekerja biasa
skip_sc: [BME]     # SC yang belum ada aktivitas di site: dilewati oleh cek_data
me_group: "OWJJ Construction M&E"   # grup narasi + foto progres (bukan SC); dicek oleh cek_data
attendance_in_posting: [DJK]   # absensi DJK ada di teks Posting (daftar nama), tidak ada PDF Attendance
